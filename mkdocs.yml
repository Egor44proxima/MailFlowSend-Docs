site_name: MailFlowSend Documentation
site_description: Публічна документація MailFlowSend — операторська робота, архітектура, експлуатація та релізи.
site_author: MailFlowSend
site_url: https://egor44proxima.github.io/MailFlowSend-Docs/
repo_url: https://github.com/Egor44proxima/MailFlowSend-Docs
repo_name: Egor44proxima/MailFlowSend-Docs
edit_uri: edit/main/docs/

theme:
  name: material
  language: uk
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Темна тема
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Світла тема

nav:
  - Головна: index.md
  - Початок роботи:
      - Огляд: getting-started/index.md
      - Інсталяція та запуск: getting-started/installation.md
      - Перший запуск: getting-started/first-run.md
  - Посібник користувача:
      - Карта робочих областей: user-guide/index.md
      - 01 · Огляд: user-guide/overview.md
      - 02 · Клієнти: user-guide/clients.md
      - 03 · CSM: user-guide/csm.md
      - 04 · Документи: user-guide/documents.md
      - 05 · База розсилки: user-guide/mailing-base.md
      - 06 · Кампанії: user-guide/campaigns.md
      - ▶ Перша розсилка рахунків: user-guide/first-documents-campaign.md
      - 07 · Борг: user-guide/debt.md
      - 08 · Черга: user-guide/queue.md
      - 09 · Доставка: user-guide/delivery.md
      - 10 · Недоставка: user-guide/non-delivery.md
      - 11 · Історія: user-guide/history.md
      - 12 · Аналітика: user-guide/analytics.md
      - 13 · Моніторинг: user-guide/monitoring.md
      - 14 · Вхідна пошта: user-guide/inbox.md
      - 15 · DSN огляд: user-guide/dsn.md
      - 16 · Діагностика: user-guide/diagnostics.md
      - 17 · Системний журнал: user-guide/system-log.md
      - 18 · Відновлення: user-guide/recovery.md
      - 19 · Модулі: user-guide/modules.md
      - 20 · Налаштування: user-guide/settings.md
  - Експлуатація:
      - Runtime режими: operations/runtime-modes.md
      - SMTP: operations/smtp.md
      - Системний журнал: operations/logging.md
      - Відновлення та безпека: operations/recovery-safety.md
  - Архітектура:
      - Огляд: architecture/index.md
      - Системний контекст: architecture/system-context.md
      - Lifecycle від кампанії до History: architecture/send-lifecycle.md
      - Delivery / DSN evidence: architecture/delivery-evidence.md
      - Runtime та сховище: architecture/runtime-storage.md
      - Evidence модель: architecture/evidence-model.md
      - Дані та SQLite: architecture/data.md
      - Модулі: architecture/modules.md
  - Developer Handbook:
      - Огляд системи: developer-handbook/index.md
      - Структура вихідного коду: developer-handbook/source-layout.md
      - Startup & shutdown lifecycle: developer-handbook/startup-lifecycle.md
      - CoreDB та SQLite schema: developer-handbook/coredb-schema.md
      - Wails API: developer-handbook/wails-api.md
      - Outbound mail flow: developer-handbook/outbound-mail.md
      - Inbound / DSN flow: developer-handbook/inbound-dsn.md
      - Runtime modules & workers: developer-handbook/modules-workers.md
      - Logging & observability: developer-handbook/logging-observability.md
      - Recovery architecture: developer-handbook/recovery.md
      - Runtime security: developer-handbook/runtime-security.md
      - Testing & CI: developer-handbook/testing-ci.md
      - Dependency map: developer-handbook/dependency-map.md
  - Розробка:
      - Середовище і збірка: development/build.md
      - Acceptance workflow: development/acceptance.md
      - Публічна документація: development/docs-policy.md
  - Релізи:
      - Огляд: releases/index.md
      - MAIL-14 · Spintax: releases/mail-14.md
      - MAIL-15 · Logging: releases/mail-15.md
      - MAIL-16 · History Export: releases/mail-16.md
  - Довідник:
      - Статуси та інваріанти: reference/status-contracts.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true

plugins:
  - search:
      lang:
        - uk
        - en

extra_css:
  - assets/stylesheets/extra.css

copyright: "MailFlowSend Documentation · Public-safe technical reference"
