name: Deploy documentation to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install documentation dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate source freshness status
        env:
          MAILFLOWSEND_SOURCE_TOKEN: ${{ secrets.MAILFLOWSEND_SOURCE_TOKEN }}
        run: python scripts/docs-freshness.py --output docs/assets/source-status.json

      - name: Build MkDocs site
        run: mkdocs build --strict

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  freshness-gate:
    name: Docs Freshness Gate
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify documented source SHA is current
        env:
          MAILFLOWSEND_SOURCE_TOKEN: ${{ secrets.MAILFLOWSEND_SOURCE_TOKEN }}
        run: python scripts/docs-freshness.py --check-only --strict
